# Despliegue en Render. Se aplica automáticamente con cada push a master,
# pero solo después de que pasan las verificaciones de GitHub Actions (.github/workflows/ci.yml).
services:
  - type: web
    name: angeleterno
    runtime: node
    plan: free
    region: ohio
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    # El plan gratuito no tiene disco persistente: en cada arranque se carga el catálogo de ejemplo
    startCommand: npm run seed && npm start
    healthCheckPath: /api/config
    envVars:
      - key: SESSION_SECRET
        generateValue: true
