name: CI y publicación

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Tipos y build
        run: npm run build

      - name: Arranque del servidor en modo producción
        env:
          PORT: 3000
          SESSION_SECRET: ci-secret
        run: |
          npm run seed
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/config && break
            sleep 1
          done
          test "$(curl -sf http://localhost:3000/api/products | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).products.length))')" -gt 0
          curl -sf http://localhost:3000/catalogo | grep -q '<div id="root">'

  # Publica la versión demo (sin servidor) en GitHub Pages cuando la verificación pasa en master
  publicar:
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build de la versión demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
