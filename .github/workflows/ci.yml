name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Tipos y build
        run: npm run build

      - name: Arranque del servidor en modo producción
        env:
          PORT: 3000
          SESSION_SECRET: ci-secret
        run: |
          npm run seed
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/config && break
            sleep 1
          done
          test "$(curl -sf http://localhost:3000/api/products | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).products.length))')" -gt 0
          curl -sf http://localhost:3000/catalogo | grep -q '<div id="root">'
